<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 26 26">
  <!-- Held pickaxe. The head colour is recoloured per tool tier at runtime.
       Pivot is the grip at (6, 20). -->
  <defs>
    <linearGradient id="haft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8A6A45"/>
      <stop offset="100%" stop-color="#3A2B1B"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#C9D2DA"/>
      <stop offset="55%" stop-color="#7E8C99"/>
      <stop offset="100%" stop-color="#2E3740"/>
    </linearGradient>
  </defs>
  <!-- haft -->
  <path d="M5 21 l12 -14 l3 2 l-12 14 z" fill="url(#haft)"/>
  <!-- grip wrap -->
  <path d="M5 21 l4 -5 l3 2 l-4 5 z" fill="#2A1E12"/>
  <!-- head: one spike, one blade -->
  <path d="M15 5 q7 -4 11 1 q-6 1 -8 4 z" fill="url(#head)"/>
  <path d="M15 5 q-5 -3 -4 -5 q5 0 7 3 z" fill="url(#head)"/>
  <path d="M14 4 l5 3 l-2 3 l-5 -3 z" fill="#58646F"/>
</svg>
