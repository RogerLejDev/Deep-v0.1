<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ABERRANT. The first thing down here that is clearly wrong. Elongated,
       too many eyes, limbs that do not attach where limbs should. Mostly
       silhouette with glowing eyes, so it reads as a shape you half-saw. -->
  <defs>
    <linearGradient id="flesh" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#3B3350"/>
      <stop offset="45%" stop-color="#1E1A2C"/>
      <stop offset="100%" stop-color="#07060C"/>
    </linearGradient>
    <radialGradient id="eyeglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF4D0"/>
      <stop offset="35%" stop-color="#FFB45C"/>
      <stop offset="100%" stop-color="#E0561F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="limb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2438"/>
      <stop offset="100%" stop-color="#0A0810"/>
    </linearGradient>
    <radialGradient id="dread" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#2A1838" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#2A1838" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="32" cy="30" r="31" fill="url(#dread)"/>

  <!-- trailing filaments -->
  <path d="M26 50 q-4 10 -2 14" fill="none" stroke="#1A1626" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M34 52 q3 8 1 12" fill="none" stroke="#1A1626" stroke-width="1.6" stroke-linecap="round" opacity="0.7"/>

  <!-- limbs: too long, too thin, wrong joints -->
  <path d="M22 28 q-14 4 -19 18 l4 2 q6 -13 17 -15 z" fill="url(#limb)"/>
  <path d="M24 34 q-12 10 -11 24 l4 0 q0 -12 10 -20 z" fill="url(#limb)"/>
  <path d="M42 26 q15 1 20 15 l-4 2 q-5 -12 -17 -13 z" fill="url(#limb)"/>
  <path d="M41 36 q13 9 12 24 l-4 -1 q1 -12 -11 -19 z" fill="url(#limb)"/>

  <!-- torso: elongated teardrop -->
  <path d="M32 2 q13 6 12 24 q-1 20 -12 30 q-11 -10 -12 -30 q-1 -18 12 -24 z" fill="url(#flesh)"/>
  <!-- ribbing -->
  <path d="M23 22 q9 4 18 0" fill="none" stroke="#453B5C" stroke-width="1" opacity="0.5"/>
  <path d="M22 30 q10 4 20 0" fill="none" stroke="#453B5C" stroke-width="1" opacity="0.4"/>
  <path d="M23 38 q9 4 18 0" fill="none" stroke="#453B5C" stroke-width="1" opacity="0.3"/>

  <!-- eye cluster: asymmetric, uneven sizes -->
  <circle cx="28" cy="15" r="6" fill="url(#eyeglow)"/>
  <circle cx="28" cy="15" r="2.4" fill="#FFE6A8"/>
  <circle cx="37" cy="12" r="4.5" fill="url(#eyeglow)"/>
  <circle cx="37" cy="12" r="1.7" fill="#FFE6A8"/>
  <circle cx="34" cy="21" r="3.6" fill="url(#eyeglow)"/>
  <circle cx="34" cy="21" r="1.3" fill="#FFE6A8"/>
  <circle cx="25" cy="23" r="2.6" fill="url(#eyeglow)"/>
  <circle cx="25" cy="23" r="0.9" fill="#FFE6A8"/>
  <circle cx="39" cy="19" r="2.0" fill="url(#eyeglow)"/>

  <!-- mouth seam -->
  <path d="M27 44 q5 3 10 0 q-5 6 -10 0 z" fill="#060509"/>
  <path d="M28 45 l1.5 3 M31.5 46 l0.5 3.2 M35 45 l-1.2 3" stroke="#6B5A38" stroke-width="0.8" opacity="0.75"/>
</svg>
