<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 28 44">
  <!-- Save beacon: a shard of lumen crystal in an iron cradle. -->
  <defs>
    <linearGradient id="bshard" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#EAFBFF"/>
      <stop offset="45%" stop-color="#6FD8F2"/>
      <stop offset="100%" stop-color="#1E5F86"/>
    </linearGradient>
    <radialGradient id="bhalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8FE6FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8FE6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bbase" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5C676F"/><stop offset="100%" stop-color="#232A30"/>
    </linearGradient>
  </defs>
  <circle cx="14" cy="16" r="14" fill="url(#bhalo)"/>
  <!-- cradle -->
  <path d="M6 40 l16 0 l-2 -6 l-12 0 z" fill="url(#bbase)"/>
  <path d="M3 40 l22 0 l0 4 l-22 0 z" fill="#2C343A"/>
  <path d="M9 34 q5 -4 10 0" fill="none" stroke="#78848D" stroke-width="2"/>
  <!-- shard -->
  <path d="M14 2 l7 16 l-4 16 l-6 0 l-4 -16 z" fill="url(#bshard)"/>
  <path d="M14 2 l0 32" fill="none" stroke="#DFFAFF" stroke-width="1.2" opacity="0.6"/>
  <path d="M14 2 l7 16 l-7 -4 z" fill="#FFFFFF" opacity="0.35"/>
</svg>
