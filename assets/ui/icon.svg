<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- DEEP app icon: a descending shaft with a single light at the bottom. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#16202B"/>
      <stop offset="60%" stop-color="#0A0E15"/>
      <stop offset="100%" stop-color="#04060A"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EAFBFF"/>
      <stop offset="35%" stop-color="#6FD8F2" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1E5F86" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%" stop-color="#2B3540"/>
      <stop offset="100%" stop-color="#141A21"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="26" fill="url(#bg)"/>
  <!-- shaft walls -->
  <path d="M0 26 q22 6 30 20 q7 14 2 30 q-6 18 4 52 l-36 0 z" fill="url(#rock)"/>
  <path d="M128 22 q-26 8 -34 24 q-6 14 0 28 q7 20 -2 54 l36 0 z" fill="url(#rock)"/>
  <!-- strata lines -->
  <path d="M6 54 q18 4 26 -2 M8 78 q20 5 28 -2 M92 52 q18 5 28 -1 M94 80 q18 4 28 -2"
        stroke="#3C4A57" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- light at the bottom -->
  <circle cx="64" cy="92" r="34" fill="url(#glow)"/>
  <path d="M64 70 l12 20 l-5 22 l-14 0 l-5 -22 z" fill="#CDF6FF"/>
  <path d="M64 70 l12 20 l-12 4 z" fill="#FFFFFF" opacity="0.5"/>
  <!-- falling motes -->
  <circle cx="46" cy="36" r="2.2" fill="#8FE6FF" opacity="0.8"/>
  <circle cx="82" cy="28" r="1.6" fill="#8FE6FF" opacity="0.6"/>
  <circle cx="70" cy="48" r="1.4" fill="#8FE6FF" opacity="0.5"/>
</svg>
